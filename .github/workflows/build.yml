name: Build

# Publishing a release (any new tag, e.g. v1.0.1 or 1.1) builds the exe and
# attaches it to that release. "Run workflow" builds a test copy, or, with a
# release tag filled in, builds that release and attaches the exe to it.
on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (e.g. 1.0). Leave empty for a test build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Build PyInstaller's launcher from source.
      - name: Install PyInstaller with a freshly compiled bootloader
        shell: pwsh
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-binary pyinstaller pyinstaller==6.11.1

      - name: Set version from tag
        if: env.TAG != ''
        shell: pwsh
        run: |
          $v = "$env:TAG".TrimStart('v', 'V')
          Set-Content -Path bridge/version.py -Value "__version__ = `"$v`""

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Fetch SimConnect.dll
        shell: pwsh
        run: |
          python -m pip download --no-deps SimConnect==0.4.26 -d dl
          $whl = (Get-ChildItem dl\*.whl)[0].FullName
          python -m zipfile -e $whl dl\x
          Copy-Item dl\x\SimConnect\SimConnect.dll .

      - name: Version details for the exe
        run: python tools/make_version_file.py version_info.txt

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name BrunnerFenixBridge --version-file version_info.txt --add-binary "SimConnect.dll;." main.py

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\BrunnerFenixBridge.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -NoNewline -Path dist\BrunnerFenixBridge.exe.sha256 -Value $h

      - name: Package zip (exe + README + LICENSE)
        shell: pwsh
        run: |
          $v = if ($env:TAG) { "$env:TAG".TrimStart('v', 'V') } else { "test" }
          New-Item -ItemType Directory -Force pkg\BrunnerFenixBridge | Out-Null
          Copy-Item dist\BrunnerFenixBridge.exe, README.md, LICENSE pkg\BrunnerFenixBridge\
          Compress-Archive -Path pkg\BrunnerFenixBridge -DestinationPath "dist\BrunnerFenixBridge-$v.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: BrunnerFenixBridge
          path: dist/*

      - name: Attach to release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/BrunnerFenixBridge-*.zip
            dist/BrunnerFenixBridge.exe
            dist/BrunnerFenixBridge.exe.sha256
          generate_release_notes: true
